name: Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: "4.3.7"
  HXCPP_COMMIT: "0376e9b19af9a4d91f9d9afc131a358467856a10"

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Configure Android
        shell: bash
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            pkg-config \
            ninja-build

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Configure Haxelib
        shell: bash
        run: |
          git config --global http.version HTTP/1.1
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          haxelib setup "$GITHUB_WORKSPACE/.haxelib"

      - name: Install HMM
        shell: bash
        run: haxelib install hmm --quiet

      - name: Install hxcpp directly
        shell: bash
        run: |
          git init "$RUNNER_TEMP/hxcpp"
          git -C "$RUNNER_TEMP/hxcpp" remote add origin https://github.com/FunkinCrew/hxcpp.git
          git -C "$RUNNER_TEMP/hxcpp" fetch --depth 1 origin "$HXCPP_COMMIT"
          git -C "$RUNNER_TEMP/hxcpp" checkout --detach FETCH_HEAD
          haxelib dev hxcpp "$RUNNER_TEMP/hxcpp"

      - name: Install remaining Haxe dependencies
        shell: bash
        run: |
          jq '.dependencies |= map(select(.name != "hxcpp"))' hmm.json > hmm.json.tmp
          mv hmm.json.tmp hmm.json
          haxelib run hmm install

      - name: Verify hxcpp
        shell: bash
        run: |
          haxelib list
          HXCPP_PATH="$(haxelib libpath hxcpp)"
          test -d "$HXCPP_PATH/tools/hxcpp"
          echo "HXCPP_PATH=$HXCPP_PATH" >> "$GITHUB_ENV"

      - name: Build hxcpp
        shell: bash
        run: |
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime
        shell: bash
        run: haxelib run lime rebuild cpp

      - name: Setup Lime Android
        shell: bash
        run: |
          haxelib run lime setup android <<EOF
          $ANDROID_SDK_ROOT
          $ANDROID_NDK_ROOT
          $JAVA_HOME
          EOF

      - name: Rebuild Lime Android
        shell: bash
        run: haxelib run lime rebuild android

      - name: Build Android
        shell: bash
        run: haxelib run lime build android -arm64 -release -DGITHUB_BUILD

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Android-Release
          path: |
            export/release/android/**/*.apk
            export/release/android/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14